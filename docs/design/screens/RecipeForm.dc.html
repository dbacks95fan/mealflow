<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MealFlow review recipe draft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0b6b73}a:hover{color:#7d1223}
input::placeholder{color:#7a7368}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f7f1e2; color: #1a1a1a; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 16px 12px 0; display: flex; align-items: center; gap: 4px">
    <a href="AddRecipe.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1a1a1a; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">Review recipe</h1>
  </header>

  <div style="margin: 10px 20px 0; padding: 10px 12px; border-radius: 12px; border: 1px solid #30ced8; background: #e6f8f9; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.4">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b6b73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    <span>Imported from a web page. Check each ingredient, then save. Nothing is saved until you do.</span>
  </div>

  <form style="padding: 14px 20px 160px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">
      Recipe name
      <input defaultValue="Turkey Chili" style="height: 48px; padding: 0 12px; border: 1px solid #d9cba6; border-radius: 10px; background: #ffffff; font: inherit; font-size: 16px; font-weight: 400; color: #1a1a1a">
    </label>

    <div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">
        Servings
        <input type="number" min="1" defaultValue="8" style="height: 48px; padding: 0 12px; border: 1px solid #d9cba6; border-radius: 10px; background: #ffffff; font: inherit; font-size: 16px; font-weight: 400; color: #1a1a1a">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">
        Tags
        <span style="min-height: 48px; padding: 6px 8px; box-sizing: border-box; border: 1px solid #d9cba6; border-radius: 10px; background: #ffffff; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
          <span style="background: #e3d4ad; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600">dinner</span>
          <span style="background: #e3d4ad; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600">slow cooker</span>
          <input placeholder="Add tag" style="flex: 1; min-width: 60px; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; font-weight: 400; color: #1a1a1a">
        </span>
      </label>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px">Ingredients ({{rowCount}})</legend>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="background: #ffffff; border: 1px solid #e6dcc0; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
          <span style="display: flex; gap: 8px; align-items: center">
            <input aria-label="Ingredient {{r.n}} name" defaultValue="{{r.name}}" placeholder="Ingredient" style="flex: 1; min-width: 0; height: 44px; padding: 0 10px; border: 1px solid #d9cba6; border-radius: 9px; font: inherit; font-size: 16px; font-weight: 600; color: #1a1a1a">
            <button type="button" onClick="{{r.remove}}" aria-label="Remove ingredient {{r.n}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 9px; background: transparent; color: #5c5750; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </span>
          <span style="display: grid; grid-template-columns: 64px 84px minmax(0, 1fr); gap: 8px">
            <input aria-label="Ingredient {{r.n}} quantity" defaultValue="{{r.qty}}" placeholder="Qty" inputmode="decimal" style="min-width: 0; height: 40px; padding: 0 8px; border: 1px solid #d9cba6; border-radius: 9px; font: inherit; font-size: 15px; color: #1a1a1a">
            <input aria-label="Ingredient {{r.n}} unit" defaultValue="{{r.unit}}" placeholder="Unit" style="min-width: 0; height: 40px; padding: 0 8px; border: 1px solid #d9cba6; border-radius: 9px; font: inherit; font-size: 15px; color: #1a1a1a">
            <input aria-label="Ingredient {{r.n}} note" defaultValue="{{r.note}}" placeholder="Note" style="min-width: 0; height: 40px; padding: 0 8px; border: 1px solid #d9cba6; border-radius: 9px; font: inherit; font-size: 15px; color: #1a1a1a">
          </span>
        </div>
      </sc-for>
      <button type="button" onClick="{{addRow}}" style="height: 48px; border-radius: 12px; border: 2px dashed #d9cba6; background: transparent; color: #0b6b73; font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add ingredient
      </button>
    </fieldset>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 22px; background: #ffffff; border-top: 1px solid #d9cba6; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px">
    <a href="AddRecipe.dc.html" style="height: 52px; border-radius: 12px; border: 1px solid #d9cba6; background: #ffffff; color: #1a1a1a; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Cancel</a>
    <a href="RecipeDetail.dc.html" style="height: 52px; border-radius: 12px; background: #a71930; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Save recipe</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.nextKey = 7;
    this.state = { rows: [
      { k: 1, name: 'ground turkey', qty: '2', unit: 'lb', note: '' },
      { k: 2, name: 'kidney beans', qty: '2', unit: 'can', note: 'drained' },
      { k: 3, name: 'diced tomatoes', qty: '28', unit: 'oz', note: '' },
      { k: 4, name: 'yellow onion', qty: '1', unit: '', note: 'diced' },
      { k: 5, name: 'garlic', qty: '4', unit: 'cloves', note: 'minced' },
      { k: 6, name: 'chili powder', qty: '2', unit: 'tbsp', note: '' }
    ] };
  }
  renderVals() {
    var self = this;
    var rows = this.state.rows;
    return {
      rowCount: rows.length,
      rows: rows.map(function (r, i) {
        return Object.assign({}, r, {
          n: i + 1,
          remove: function () {
            if (self.state.rows.length === 1) return;
            self.setState({ rows: self.state.rows.filter(function (x) { return x.k !== r.k; }) });
          }
        });
      }),
      addRow: function () {
        var k = self.nextKey++;
        self.setState({ rows: self.state.rows.concat([{ k: k, name: '', qty: '', unit: '', note: '' }]) });
      }
    };
  }
}
</script>
</body>
</html>
