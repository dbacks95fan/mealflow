<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MealFlow desktop library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0b6b73}a:hover{color:#7d1223}
input::placeholder{color:#7a7368}
</style>
</helmet>
<div style="min-height: 900px; background: #f7f1e2; color: #1a1a1a; font-family: Inter, system-ui, sans-serif">

  <header style="background: #ffffff; border-bottom: 3px solid #e3d4ad">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; color: #a71930">MealFlow</span>
      <nav aria-label="Primary" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1">
        <a href="#recipes" aria-current="page" style="height: 40px; padding: 0 14px; border-radius: 10px; background: #a71930; color: #ffffff; text-decoration: none; display: flex; align-items: center; font-size: 15px; font-weight: 700">Recipes</a>
        <a href="#week" style="height: 40px; padding: 0 14px; border-radius: 10px; color: #5c5750; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">This Week <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #a71930; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span></a>
        <a href="#groceries" style="height: 40px; padding: 0 14px; border-radius: 10px; color: #5c5750; text-decoration: none; display: flex; align-items: center; font-size: 15px; font-weight: 600">Groceries</a>
        <a href="#settings" style="height: 40px; padding: 0 14px; border-radius: 10px; color: #5c5750; text-decoration: none; display: flex; align-items: center; font-size: 15px; font-weight: 600">Settings</a>
      </nav>
      <span style="font-size: 14px; color: #5c5750">[Household name]</span>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 28px 32px 48px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

    <main id="recipes" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <h1 style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; line-height: 1">Recipes</h1>
        <a href="#import" style="height: 44px; padding: 0 16px; border-radius: 11px; border: 1px solid #d9cba6; background: #ffffff; color: #1a1a1a; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
          Import
        </a>
        <a href="#new" style="height: 44px; padding: 0 16px; border-radius: 11px; background: #a71930; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Add recipe
        </a>
      </div>

      <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #ffffff; border: 1px solid #d9cba6; border-radius: 12px; color: #5c5750; max-width: 520px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search recipes</span>
        <input type="search" placeholder="Search recipes or tags" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #1a1a1a">
      </label>

      <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px">
        <sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
          <li style="background: #ffffff; border: 1px solid #e6dcc0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 6px 16px rgba(0,0,0,0.04)">
            <a href="#recipe" style="text-decoration: none; color: #1a1a1a; display: flex; flex-direction: column; gap: 6px; flex: 1">
              <span style="font-size: 17px; font-weight: 700; line-height: 1.25">{{r.name}}</span>
              <span style="font-size: 13px; color: #5c5750">{{r.meta}}</span>
            </a>
            <span style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{r.tags}}" as="t" hint-placeholder-count="2">
                <span style="background: #e3d4ad; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600">{{t}}</span>
              </sc-for>
            </span>
            <sc-if value="{{r.inWeek}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" style="height: 40px; border-radius: 10px; border: 0; background: #0b6b73; color: #ffffff; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
                In this week
              </button>
            </sc-if>
            <sc-if value="{{r.notInWeek}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" style="height: 40px; border-radius: 10px; border: 1px solid #d9cba6; background: #ffffff; color: #1a1a1a; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Add to this week
              </button>
            </sc-if>
          </li>
        </sc-for>
      </ul>
    </main>

    <aside id="week" aria-label="This week" style="flex: 1 1 320px; min-width: 0; background: #ffffff; border: 1px solid #e6dcc0; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 6px 16px rgba(0,0,0,0.04)">
      <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1">This week</h2>
        <button type="button" style="height: 36px; padding: 0 8px; border: 0; background: transparent; color: #a71930; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Clear</button>
      </span>
      <ol aria-label="Shopping steps" style="list-style: none; margin: 0; padding: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #fbf7ec; border-radius: 12px">
        <li style="height: 34px; border-radius: 9px; background: #a71930; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">1 Plan</li>
        <li style="height: 34px; border-radius: 9px; color: #5c5750; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">2 List</li>
        <li style="height: 34px; border-radius: 9px; color: #5c5750; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">3 Fry’s cart</li>
      </ol>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{week}}" as="w" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0e8d4">
            <span style="width: 6px; height: 36px; border-radius: 3px; background: #e3d4ad"></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 700">{{w.name}}</span>
              <span style="font-size: 12px; color: #5c5750">{{w.meta}}</span>
            </span>
            <button type="button" aria-label="Remove {{w.name}} from this week" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #5c5750; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </li>
        </sc-for>
      </ul>
      <span style="font-size: 13px; color: #5c5750">3 recipes · 30 ingredients before combining</span>
      <a href="#groceries" style="height: 50px; border-radius: 12px; background: #a71930; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700">
        Build the grocery list
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var recipes = [
      { name: 'Green Chile Chicken Enchiladas', meta: '11 ingredients · serves 6', tags: ['dinner', 'mexican'], inWeek: true },
      { name: 'Turkey Chili', meta: '9 ingredients · serves 8', tags: ['dinner', 'slow cooker'], inWeek: true },
      { name: 'Sheet Pan Chicken Fajitas', meta: '10 ingredients · serves 4', tags: ['dinner', 'weeknight'], inWeek: true },
      { name: 'Lemon Garlic Pasta', meta: '7 ingredients · serves 4', tags: ['dinner', 'vegetarian'], inWeek: false },
      { name: 'Overnight Oats', meta: '6 ingredients · serves 2', tags: ['breakfast'], inWeek: false },
      { name: 'Carne Asada Tacos', meta: '12 ingredients · serves 6', tags: ['dinner', 'grill'], inWeek: false }
    ].map(function (r) { return Object.assign({}, r, { notInWeek: !r.inWeek }); });
    return {
      recipes: recipes,
      week: recipes.filter(function (r) { return r.inWeek; })
    };
  }
}
</script>
</body>
</html>
